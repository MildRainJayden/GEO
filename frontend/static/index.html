<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIVC - AI Visibility China</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #f4f7fa; color: #162231; }
    header { padding: 22px 5vw; background: #111827; color: white; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    main { padding: 24px 5vw 48px; display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 700; font-size: 13px; }
    .check input { width: auto; }
    input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px 12px; font: inherit; background: white; }
    textarea { min-height: 76px; resize: vertical; }
    button { margin-top: 14px; border: 0; border-radius: 6px; padding: 11px 14px; background: #0f766e; color: white; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    section, form { background: white; border: 1px solid #d9e2ec; border-radius: 8px; padding: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .metric { border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; background: #fbfdff; }
    .metric strong { display: block; font-size: 28px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #e5eaf0; padding: 9px 8px; text-align: left; font-size: 14px; }
    th { background: #edf3f8; }
    pre { background: #111827; color: #e5e7eb; border-radius: 6px; padding: 12px; white-space: pre-wrap; overflow: auto; }
    .chart-grid { display: grid; grid-template-columns: minmax(240px, .9fr) minmax(320px, 1.1fr); gap: 14px; margin: 16px 0; }
    .chart-card { border: 1px solid #d9e2ec; border-radius: 8px; padding: 14px; background: #fbfdff; }
    .chart-card h3 { margin-top: 0; }
    .note { color: #64748b; font-size: 13px; line-height: 1.7; }
    .summary { background: #eef7f5; border-color: #b7d8d2; margin-bottom: 14px; }
    svg.chart { width: 100%; height: auto; overflow: visible; }
    .legend { display: grid; gap: 7px; font-size: 13px; margin-top: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    @media (max-width: 720px) { .chart-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>AI Visibility China</h1>
    <span>中国 AI 搜索可见度与 GEO 优化平台</span>
  </header>
  <main>
    <form id="auditForm">
      <h2>新建测评</h2>
      <label>品牌</label>
      <input name="brand_name" value="美的" required />
      <label>官网</label>
      <input name="website" placeholder="可为空，系统自动调研补充" />
      <label>行业</label>
      <input name="industry" placeholder="可为空，系统自动调研补充" />
      <label>主要产品，每行一个</label>
      <textarea name="products" placeholder="可为空，系统自动调研补充"></textarea>
      <label>竞品，每行一个</label>
      <textarea name="competitors" placeholder="可为空，系统自动调研补充"></textarea>
      <label>模型</label>
      <select name="provider">
        <option value="">自动选择已配置模型</option>
        <option value="gpt">GPT</option>
        <option value="deepseek">DeepSeek</option>
        <option value="doubao">豆包</option>
        <option value="minimax">MiniMax</option>
        <option value="qwen">千问</option>
      </select>
      <button id="runButton" type="submit">开始测评</button>
    </form>
    <section>
      <h2>结果</h2>
      <div id="status">等待测评。</div>
      <div id="result"></div>
    </section>
  </main>
  <script>
    const form = document.getElementById("auditForm");
    const button = document.getElementById("runButton");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      statusBox.textContent = "正在补全品牌信息、自动生成问题并调用选定模型...";
      resultBox.innerHTML = "";
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      data.products = data.products.split(/\n+/).map(v => v.trim()).filter(Boolean);
      data.competitors = data.competitors.split(/\n+/).map(v => v.trim()).filter(Boolean);
      data.providers = data.provider ? [data.provider] : [];
      delete data.provider;
      if (!data.website) delete data.website;
      if (!data.industry) delete data.industry;
      if (!data.providers.length) delete data.providers;
      try {
        const response = await fetch("/audit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const audit = await response.json();
        if (!response.ok) throw new Error(audit.error || "请求失败");
        if (audit.status === "failed") throw new Error(audit.error || "任务失败");
        renderResult(audit.result, audit.id);
        statusBox.textContent = `测评完成：${audit.id}`;
      } catch (error) {
        statusBox.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    function renderResult(result, id) {
      const platforms = result.score.platform_scores.map(row => `<tr><td>${row.provider}</td><td>${row.score}</td><td>${Math.round(row.mention_rate * 100)}%</td><td>${Math.round(row.accuracy_rate * 100)}%</td><td>${row.explanation || ""}</td></tr>`).join("");
      const competitors = result.competitors.slice(0, 8).map(row => `<tr><td>${escapeHtml(row.brand)}</td><td>${percent(row.voice_share || row.mention_rate)}</td><td>${percent(row.occurrence_rate || row.accuracy_rate)}</td><td>${row.average_rank ? Number(row.average_rank).toFixed(2) : "-"}</td><td>${percent(row.top3_rate)}</td><td>${percent(row.scenario_coverage)}</td><td>${row.effective_sample_count || "-"}</td></tr>`).join("");
      const gaps = result.content_gaps.map(gap => `<li><strong>${gap.priority}</strong> ${gap.question}：${gap.reason}</li>`).join("");
      const suggestion = result.geo_suggestions[0];
      const taskPrompts = result.tasks.slice(0, 5).map(task => `<details><summary>Day ${task.day} ${task.title}</summary><pre>${task.prompt_template || ""}</pre></details>`).join("");
      const leader = result.competitors[0]?.brand || "暂无竞品数据";
      const own = result.competitors.find(row => row.brand === result.input.brand_name);
      const ownShare = own ? percent(own.voice_share || own.mention_rate) : "暂无";
      resultBox.innerHTML = `
        <section class="summary">
          <h3>报告总结</h3>
          <p>${escapeHtml(result.input.brand_name)} 本轮 AI 可见度总分为 ${result.score.total_score}，其中基础可见度为 ${result.score.base_visibility_score || result.score.total_score}，竞争声量分为 ${result.score.competitive_voice_score || 0}。行业基准竞品矩阵中，当前声量领先品牌为 ${escapeHtml(leader)}；${escapeHtml(result.input.brand_name)} 的 AI 声量份额为 ${ownShare}。</p>
        </section>
        <div class="grid">
          <div class="metric">总分<strong>${result.score.total_score}</strong></div>
          <div class="metric">问题<strong>${result.questions.length}</strong></div>
          <div class="metric">回答<strong>${result.responses.length}</strong></div>
          <div class="metric">竞争声量<strong>${result.score.competitive_voice_score || 0}</strong></div>
        </div>
        <p class="note">核心评分说明：基础可见度由品牌提及、描述准确率、行业/产品覆盖、平台覆盖计算；最终总分 = 基础可见度 70% + 竞争声量 30%。竞争声量来自行业基准竞品矩阵，因此当品牌自身问题表现好、但行业声量份额低时，总分会被拉低。</p>
        <h3>自动补全信息</h3>
        <p>${result.input.industry || "未识别行业"} · ${result.input.product_text}</p>
        <div class="chart-grid">
          <div class="chart-card"><h3>评分构成</h3>${scorePie(result)}</div>
          <div class="chart-card"><h3>平台得分</h3>${barChart(result.score.platform_scores.map(row => [row.provider, row.score, 100]), "")}</div>
        </div>
        <h3>平台表现</h3>
        <p class="note">说明：平台得分按单个模型的回答单独计算；多模型总分聚合所有成功模型的回答。</p>
        <table><tr><th>平台</th><th>评分</th><th>提及率</th><th>准确率</th><th>解释</th></tr>${platforms}</table>
        <h3>行业基准竞品矩阵</h3>
        <p class="note">说明：AI 声量份额是候选品牌在行业基准回答中的排名加权份额，整张表加总约 100%；出现率表示有效回答中有多少比例提到该品牌；平均排名越小越靠前；Top3率表示进入前三的比例；场景题出现率只统计场景类问题。0 通常表示本轮有效样本未提及，不代表品牌没有真实市场影响力。</p>
        <div class="chart-card">${barChart(result.competitors.slice(0, 10).map(row => [row.brand, (row.voice_share || row.mention_rate) * 100, 100]), "%")}</div>
        <table><tr><th>品牌</th><th>AI 声量份额</th><th>出现率</th><th>平均排名</th><th>Top3率</th><th>场景题出现率</th><th>有效样本</th></tr>${competitors}</table>
        <h3>内容缺口</h3>
        <p class="note">说明：内容缺口结合模型回答中的弱项、竞品上下文和 AI 个性化分析生成，用于指导官网、FAQ、对比页、案例页等内容建设。</p>
        <ul>${gaps}</ul>
        <h3>${suggestion.title}</h3>
        <p class="note">GEO 优化建议说明：建议优先面向 AI 容易引用和总结的内容形态，例如结构化 FAQ、参数对比、权威来源、真实案例和清晰结论。</p>
        <p>${suggestion.action}</p>
        <pre>${suggestion.copyable_content}</pre>
        <h3>30 天任务提示词模板</h3>
        ${taskPrompts}
        <p><a href="/audit/${id}/report" target="_blank" rel="noreferrer">打开 HTML 报告</a></p>
        <p><a href="/audit/${id}/report.pdf" target="_blank" rel="noreferrer">下载 PDF 报告</a></p>
      `;
    }

    function scorePie(result) {
      const parts = [
        ["品牌提及", result.score.mention_rate_score, 40, "#0f766e"],
        ["准确率", result.score.accuracy_score, 30, "#2563eb"],
        ["行业/产品覆盖", result.score.industry_coverage_score, 20, "#ca8a04"],
        ["平台覆盖", result.score.platform_coverage_score, 10, "#7c3aed"],
      ];
      const radius = 58;
      const circumference = 2 * Math.PI * radius;
      const total = Math.max(1, parts.reduce((sum, part) => sum + part[1], 0));
      let offset = 0;
      const circles = parts.map(([label, value, maxValue, color]) => {
        const length = value / total * circumference;
        const circle = `<circle cx="84" cy="84" r="${radius}" fill="none" stroke="${color}" stroke-width="28" stroke-dasharray="${length.toFixed(2)} ${(circumference - length).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 84 84)" />`;
        offset += length;
        return circle;
      }).join("");
      const legend = parts.map(([label, value, maxValue, color]) => `<span><i class="swatch" style="background:${color}"></i>${label}：${Number(value).toFixed(1)}/${maxValue}</span>`).join("");
      return `<div style="display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center">
        <svg class="chart" viewBox="0 0 168 168" role="img" aria-label="评分构成饼图">
          <circle cx="84" cy="84" r="58" fill="none" stroke="#e5eaf0" stroke-width="28"></circle>
          ${circles}
          <text x="84" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#1d2733">${Number(result.score.total_score).toFixed(1)}</text>
          <text x="84" y="100" text-anchor="middle" font-size="12" fill="#667085">总分</text>
        </svg>
        <div class="legend">${legend}</div>
      </div>`;
    }

    function barChart(items, suffix) {
      if (!items.length) return `<p>暂无数据</p>`;
      const width = 620;
      const left = 126;
      const rowH = 34;
      const height = 24 + items.length * rowH;
      const bars = items.map(([label, value, maxValue], index) => {
        const y = 18 + index * rowH;
        const pct = Math.max(0, Math.min(1, value / Math.max(1, maxValue)));
        const barW = pct * (width - left - 72);
        return `<text x="0" y="${y + 15}" font-size="12" fill="#425466">${escapeHtml(String(label).slice(0, 18))}</text>
          <rect x="${left}" y="${y}" width="${width-left-72}" height="18" rx="5" fill="#edf3f8"></rect>
          <rect x="${left}" y="${y}" width="${barW.toFixed(1)}" height="18" rx="5" fill="#0f766e"></rect>
          <text x="${width - 58}" y="${y + 14}" font-size="12" fill="#1d2733">${Math.round(value)}${suffix}</text>`;
      }).join("");
      return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="条形图">${bars}</svg>`;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function percent(value) {
      return `${Math.round(Number(value || 0) * 100)}%`;
    }
  </script>
</body>
</html>
