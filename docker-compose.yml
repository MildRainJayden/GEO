services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && python -m backend.aivc.app"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aivc:aivc@postgres:5432/aivc
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aivc
      POSTGRES_USER: aivc
      POSTGRES_PASSWORD: aivc
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
